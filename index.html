<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservas del Condominio</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header class="app-header"><h1>Reserva de Espacios</h1></header>

  <main class="container">
    <div id="alert" role="alert" hidden></div>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Nueva reserva</h2>
      <form id="reserva-form" novalidate>
        <input type="hidden" id="reserva-id" />
        <label>Residente
          <select id="residente_id" required></select>
        </label>
        <label>Espacio
          <select id="espacio_id" required></select>
        </label>
        <label>Fecha
          <input type="date" id="fecha" required />
        </label>
        <label>Hora inicio
          <input type="time" id="hora_inicio" required />
        </label>
        <label>Hora fin
          <input type="time" id="hora_fin" required />
        </label>
        <label>Notas
          <input type="text" id="notas" maxlength="255" />
        </label>
        <div class="actions">
          <button type="submit" id="btn-guardar">Reservar</button>
          <button type="button" id="btn-cancelar" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <h2 id="list-title">Reservas registradas</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Espacio</th><th>Residente</th><th>Fecha</th><th>Horario</th><th>Acciones</th></tr>
          </thead>
          <tbody id="reservas-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
